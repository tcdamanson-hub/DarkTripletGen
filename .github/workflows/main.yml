name: Build plugin

on:
  push:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin a compiler"
        type: choice
        options: [melodie, drums, les-deux]
        default: melodie

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # on ne compile que le plugin modifie (un push sans choix compile les deux)
      PLUGIN: ${{ inputs.plugin || 'les-deux' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build MELODIE
        if: env.PLUGIN != 'drums'
        run: cmake --build build --config Release --parallel --target RantipopMelodie_All

      - name: Build DRUMS
        if: env.PLUGIN != 'melodie'
        run: cmake --build build --config Release --parallel --target RantipopDrums_All

      - name: Sons POP WAVE (OB From Mars) livres dans le plugin
        if: runner.os == 'Windows' && env.PLUGIN != 'drums'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download sss -p WAV.zip -D sons --repo "${{ github.repository }}"
          unzip -q sons/WAV.zip -d sonsx
          find sonsx -name .DS_Store -delete
          for b in build/RantipopMelodie_artefacts/Release/VST3/*.vst3; do
            dest="$b/Contents/Resources/RANTIPOP Sounds/OB From Mars"
            mkdir -p "$dest"
            cp -r sonsx/WAV/* "$dest/"
            echo "sons copies dans $dest : $(find "$dest" -name '*.wav' | wc -l) fichiers"
            # packs du depot (Essential POP...) : a cote, dans le meme dossier de sons
            cp -r Rantipop/Packs/* "$b/Contents/Resources/RANTIPOP Sounds/"
            echo "packs du depot copies : $(find "$b/Contents/Resources/RANTIPOP Sounds" -name '*.flac' | wc -l) fichiers"
          done

      - name: Upload MELODIE
        if: env.PLUGIN != 'drums'
        uses: actions/upload-artifact@v4
        with:
          name: RANTIPOP-MELODIE-${{ runner.os }}
          path: |
            build/RantipopMelodie_artefacts/Release/VST3
            build/RantipopMelodie_artefacts/Release/AU
            build/RantipopMelodie_artefacts/Release/Standalone

      - name: Upload DRUMS
        if: env.PLUGIN != 'melodie'
        uses: actions/upload-artifact@v4
        with:
          name: RANTIPOP-DRUMS-${{ runner.os }}
          path: |
            build/RantipopDrums_artefacts/Release/VST3
            build/RantipopDrums_artefacts/Release/Standalone
