name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DarkTripletGen-${{ runner.os }}
          path: |
            build/DarkTripletGen_artefacts/Release/VST3
            build/DarkTripletGen_artefacts/Release/AU
            build/DarkTripletGen_artefacts/Release/Standalone
            build/DarkTrapDrums_artefacts/Release/VST3
            build/DarkTrapDrums_artefacts/Release/AU
            build/DarkTrapDrums_artefacts/Release/Standalone

      - name: Upload RANTIPOP
        uses: actions/upload-artifact@v4
        with:
          name: RANTIPOP-MELODIE-${{ runner.os }}
          path: |
            build/RantipopMelodie_artefacts/Release/VST3
            build/RantipopMelodie_artefacts/Release/AU
            build/RantipopMelodie_artefacts/Release/Standalone
