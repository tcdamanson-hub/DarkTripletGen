name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel --target RantipopMelodie_All RantipopDrums_All

      - name: Sons POP WAVE (OB From Mars) livres dans le plugin
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download sss -p WAV.zip -D sons --repo "${{ github.repository }}"
          unzip -q sons/WAV.zip -d sonsx
          find sonsx -name .DS_Store -delete
          for b in build/RantipopMelodie_artefacts/Release/VST3/*.vst3; do
            dest="$b/Contents/Resources/RANTIPOP Sounds/OB From Mars"
            mkdir -p "$dest"
            cp -r sonsx/WAV/* "$dest/"
            echo "sons copies dans $dest : $(find "$dest" -name '*.wav' | wc -l) fichiers"
            # packs du depot (ex. Modern POP pour la POP)
            cp -r Rantipop/Packs/* "$b/Contents/Resources/RANTIPOP Sounds/"
            echo "packs du depot copies : $(find "$b/Contents/Resources/RANTIPOP Sounds" -name '*.flac' | wc -l) fichiers"
          done

      - name: Upload RANTIPOP
        uses: actions/upload-artifact@v4
        with:
          name: RANTIPOP-${{ runner.os }}
          path: |
            build/RantipopMelodie_artefacts/Release/VST3
            build/RantipopMelodie_artefacts/Release/AU
            build/RantipopMelodie_artefacts/Release/Standalone
            build/RantipopDrums_artefacts/Release/VST3
            build/RantipopDrums_artefacts/Release/Standalone
